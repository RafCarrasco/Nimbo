# Teste de rede descartável (ver .github/remote-viewer/*.mjs). Só existe nesta branch de teste
# e só roda quando run.txt muda. run.txt: "<id>" (espectador do motor) ou "sym <id>" / "cone <id>"
# (duas conexões de navegador, com este servidor atrás de um NAT simétrico ou não).
name: Remote viewer test

on:
  push:
    branches: [test/remote-viewer]
    paths: ['.github/remote-viewer/run.txt']

permissions:
  contents: write

jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Peer
        working-directory: .github/remote-viewer
        env:
          REMOTE_TEST_KEY: ${{ secrets.REMOTE_TEST_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm init -y > /dev/null
          npm install --no-save --no-audit --no-fund puppeteer-core@23 > /dev/null
          mode=$(cut -d' ' -f1 run.txt)
          if [ "$mode" = "sym" ]; then
            # Porta de saída sorteada a cada destino: o que um NAT simétrico faz.
            sudo iptables -t nat -A POSTROUTING -p udp -j MASQUERADE --random-fully
          fi
          if [ "$mode" = "sym" ] || [ "$mode" = "cone" ]; then node peer.mjs; else node viewer.mjs; fi
