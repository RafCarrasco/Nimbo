name: Nimbo Rust Windows PREVIEW not release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo +1.99.1 fmt --manifest-path desktop/rust/Cargo.toml --all -- --check
      - name: Lint locked Rust targets
        run: cargo +1.99.1 clippy --manifest-path desktop/rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Lint locked Rust targets with debug-only test host
        run: cargo +1.99.1 clippy --manifest-path desktop/rust/Cargo.toml --locked --all-targets --features test-host -- -D warnings
      - name: Test locked Rust crate on Windows
        run: cargo +1.99.1 test --manifest-path desktop/rust/Cargo.toml --locked
      - name: Test locked Rust crate with debug-only test host (interactive tests stay ignored)
        run: cargo +1.99.1 test --manifest-path desktop/rust/Cargo.toml --locked --features test-host
      - name: Build release host shell
        run: cargo +1.99.1 build --manifest-path desktop/rust/Cargo.toml --locked --release
      - name: Collect preview without executing it
        run: |
          $ErrorActionPreference = 'Stop'
          $output = 'preview-windows'
          New-Item -ItemType Directory -Path $output | Out-Null
          $binary = Join-Path $output 'nimbo-rust-windows-PREVIEW-not-release.exe'
          Copy-Item 'desktop/rust/target/release/nimbo-desktop.exe' $binary
          $metadata = [ordered]@{
            commit = $env:GITHUB_SHA
            sha256 = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            size_bytes = (Get-Item $binary).Length
            binary = (Split-Path $binary -Leaf)
            toolchain = '1.99.1'
            runner = $env:RUNNER_OS
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
          }
          $metadata | ConvertTo-Json | Set-Content (Join-Path $output 'metadata.json') -Encoding utf8
          @'
          Nimbo Rust Windows PREVIEW - not an installer, not a release

          Checkpoint 1 host shell: opens https://golive-ad118.web.app in a WebView2 window.
          No desktop bridge, login, deep link, screen capture, app audio, game watch,
          installer or automatic update is implemented in this preview.
          Requires the Microsoft Edge WebView2 Runtime.
          CI builds and tests the crate but does not execute this executable.
          GUI behavior requires a separate observed Windows run and operator evidence.
          Do not sign in or enter production credentials while evaluating this preview.
          Do not use this to replace an existing Nimbo installation.
          No release, production upload, signing, deployment or update is performed.
          metadata.json records the commit, SHA256 and binary size in bytes.
          '@ | Set-Content (Join-Path $output 'README.txt') -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Nimbo-Rust-Windows-PREVIEW-not-release
          path: preview-windows/
          if-no-files-found: error
          retention-days: 7
