[package]
name = "nimbo-desktop"
version = "0.4.1"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Checkpoint-2 Nimbo native policy and Windows API feasibility probe; not a shipping shell"

[dependencies]
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
    "Win32_UI_Shell", "Win32_System_Com", "Foundation", "Graphics_Capture",
    "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Gdi",
    "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
