[package]
name = "nimbo-desktop"
version = "0.4.1"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Nimbo Windows host shell (CP1 WebView2 window and policies; CP2 S1 bridge v1 with interim login answer; no capture/login/updater)"

[features]
# Debug-only isolated loopback test host. build.rs and a compile_error! reject release builds.
test-host = []

[dependencies]
url = "=2.5.8"
# Bridge v1 JSON via serde_json::Value only (no serde_derive).
serde_json = "=1.0.154"

# Debug-only transport double for the real dispatcher (stdio instead of WebView2). Never part
# of a release build: it needs `test-host`, which build.rs and a compile_error! reject there.
[[example]]
name = "bridge-stdio"
required-features = ["test-host"]

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
    "Win32_UI_Shell", "Win32_System_Com", "Foundation", "Graphics_Capture",
    "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Gdi",
    "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading",
    "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_WinRT", "Win32_Security",
] }

[build-dependencies]
embed-resource = "=3.0.12"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
