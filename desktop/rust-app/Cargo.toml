[package]
name = "nimbo-app"
version = "0.5.0"
edition = "2024"
publish = false
description = "Nimbo desktop shell in Rust (Tauri 2): the site inside WebView2 plus the native bridge. Experimental."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: build de produção sem o tauri-cli (sem ele o Tauri se comporta como "dev").
# dynamic-acl: a permissão da ponte é criada na partida, porque a origem muda com NIMBO_URL.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "custom-protocol", "dynamic-acl"] }
# Segunda abertura do app só traz a primeira janela para a frente.
tauri-plugin-single-instance = "2"
# Motor de mídia: captura, codificação pela placa e envio WebRTC (desktop/rust-media).
nimbo-media = { path = "../rust-media" }
# Telas, janelas, miniaturas e ícones para o seletor (desktop/rust-native).
nimbo-native = { path = "../rust-native" }
# Miniaturas e ícones vão para a página como data URL.
base64 = "0.22"
# Atualização automática: confere a assinatura do instalador novo antes de instalar (src/update.rs).
# native-tls: usa os certificados do Windows, como o navegador (antivírus e proxy que inspecionam
# HTTPS instalam a raiz deles lá). Sem "zip": no Windows a atualização é o próprio instalador.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Código de uso único do login.
getrandom = "0.3"
# Abre links no navegador padrão pelo ShellExecute (sem a feature, a crate chama o PowerShell).
open = { version = "5", features = ["shellexecute-on-windows"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
