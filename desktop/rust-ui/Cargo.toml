[package]
name = "nimbo-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Nimbo native interface in Rust (egui). Experimental: the official app is still desktop/rust-app."

[[bin]]
name = "nimbo-native"
path = "src/main.rs"

[dependencies]
# Login e banco em tempo real, sem interface (desktop/rust-core).
nimbo-core = { path = "../rust-core" }
# Motor (captura, codificação, envio) e player (receber, decodificar, tocar) das lives.
nimbo-media = { path = "../rust-media" }
# Telas e janelas que dá para transmitir (o mesmo levantamento do seletor do site).
sources = { package = "nimbo-native", path = "../rust-native" }
# Janela e desenho. wgpu: a mesma placa que decodifica a live desenha a interface.
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.37"
# Os mesmos ícones do site (lucide), como fonte.
lucide-icons = "1"
serde_json = "1"
# Login pelo navegador do sistema: o mesmo módulo do app atual (desktop/rust-app/src/login.rs).
getrandom = "0.3"
url = "2"
# Abre links no navegador padrão pelo ShellExecute (sem a feature, a crate chama o PowerShell).
open = { version = "5", features = ["shellexecute-on-windows"] }
# Cifra a sessão guardada com a chave do usuário do Windows (DPAPI).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
# Logo, fotos de perfil e prévias das lives (PNG, WebP e JPEG; a prévia própria sai em JPEG).
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
# Fotos e prévias vêm do banco como data URL (base64); a foto da conta Google vem por HTTPS.
base64 = "0.23"
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
